<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unloaded vault tab</title>
    <link rel="stylesheet" href="placeholder.css" />
  </head>
  <body>
    <main class="ph">
      <div class="ph-mark" aria-hidden="true"></div>
      <h1 id="ph-title">Unloaded vault tab</h1>
      <div id="ph-url" class="ph-url"></div>
      <p class="ph-note">
        This tab is a lightweight placeholder — the site has <strong>not</strong> been loaded and no data left your
        browser. It loads the moment you switch to this tab, or when you press Load.
      </p>
      <button id="ph-load" class="primary">Load this tab now</button>
    </main>
    <script type="module" src="placeholder.js"></script>
  </body>
</html>
